<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link href="{% static 'sign_in.css' %}" rel="stylesheet" />
    <link href="{% static 'navigation.css' %}" rel="stylesheet" />
    <title>Sign In - Feasto</title>
  </head>
  <body>
    <!-- Quick Navigation -->
    <nav class="navbar">
      <div class="navbar-brand">
        <span class="logo-emoji">🍕</span>
        <a href="{% url 'say_hello' %}">Feasto</a>
      </div>
      <ul class="navbar-menu">
        <li><a href="{% url 'say_hello' %}">Home</a></li>
        <li><a href="{% url 'open_signup' %}">Sign Up</a></li>
      </ul>
    </nav>

    <section class="signin_section">
      <div class="signin_card">
        <h2 class="signin_title">Sign In</h2>
        <p class="signin_description">
          Sign in to continue ordering your favorite food.
        </p>
        <form action="{% url 'signin' %}" method="POST">
          {% csrf_token %}
          <div class="form_group">
            <label>Username</label>
            <input type="text" name="username" placeholder="👤 Enter User Name" required />
          </div>
          <div class="form_group">
            <label>Password</label>
            <input type="password" name="password" placeholder="🔒 Enter the password" required />
          </div>
          <button type="submit" class="signin_button">Sign In</button>
        </form>

        <p class="signup_text">
          Don't have an account?
          <a href="{% url 'open_signup' %}">Sign Up</a>
        </p>
        
        <p class="signup_text" style="font-size: 12px; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px;">
          <a href="{% url 'say_hello' %}" style="color: #999;">Back to Home</a>
        </p>
      </div>
    </section>
  </body>
</html>
