<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>update_menu</title>
  </head>
  <body>
    <!-- Show Current Menu Here -->
    <table border="1">
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Picture</th>
          <th>Description</th>
          <th>Price</th>
          <th>Is Veg</th>
        </tr>
      </thead>
      <tbody>
        {% for item in itemList %}
        <tr>
          <td>{{item.name}}</td>
          <td><img src="{{item.picture}}" /></td>
          <td>{{item.description}}</td>
          <td>{{item.price}}</td>
          <td>{{item.vegetarian}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <!-- Add Food Item (FORM) -->
    <h2>ADD FOOD ITEM</h2>
    <form method="POST" action=" {% url 'update_menu' restaurant.id %}">
      {% csrf_token %}
      <label for="name">Item Name</label>
      <input type="text" name="name" id="name" required /><br /><br />
      <label for="description">Description</label>
      <textarea name="description" id="description" required></textarea
      ><br /><br />
      <label for="price">Price</label>
      <input type="number" name="price" , id="price" step="0.01" required />
      <br /><br />
      <label for="vegetarian">Vegetarian</label>
      <input type="checkbox" id="vegetarian" name="vegetarian" /> <br /><br />
      <label for="picture">Picture</label>
      <input type="url" id="picture" name="picture" /> <br /><br />
      <button type="submit">ADD FOOD ITEM</button>
    </form>
  </body>
</html>
