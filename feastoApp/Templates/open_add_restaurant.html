<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Restaurant</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'open_add_restaurant.css' %}">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            🍴 Feasto
        </div>
        <div class="admin-label">
            Admin Dashboard
        </div>
    </header>
    <main class="page-container">
        <div class="page-heading">
            <p class="small-title">
                RESTAURANT MANAGEMENT
            </p>
            <h1>Add New Restaurant</h1>
            <p>
                Add a restaurant and its details to Feasto.
            </p>
        </div>
        <div class="form-card">
            <form method="POST" action="{% url 'add_restaurant' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Picture URL</label>
                    <input type="text" name="picture" required>
                </div>
                <div class="form-group">
                    <label>Cuisine</label>
                    <input type="text" name="cuisine" required>
                </div>
                <div class="form-group">
                    <label>Rating</label>
                    <input
                        type="number"
                        name="rating"
                        min="0"
                        max="5"
                        step="0.1"
                        required
                    >
                </div>
                <button type="submit" class="submit-btn">
                    ADD RESTAURANT
                </button>
            </form>
        </div>
    </main>
</body>
</html>
