<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'update_restaurant.css' %}">
    <title>updateRestaurant</title>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🍴</span>
        Feasto
      </div>
      <div class="admin-link">Admin Dashboard</div>
    </header>
    <!-- Main Content -->
    <main class="main">
      <div class="section-label">RESTAURANT MANAGEMENT</div>
      <h1>Update Restaurant</h1>
      <div class="description">Update the restaurant details for Feasto.</div>
      <!-- Form -->
      <div class="form-card">
        <form
          method="POST"
          action="{% url 'update_restaurant' restaurant.id %}"
        >
          {% csrf_token %}
          <div class="form-group">
            <label>Restaurant Name</label>
            <input type="text" name="name" value="{{ restaurant.name }}" />
          </div>
          <div class="form-group">
            <label>Picture URL</label>
            <input
              type="text"
              name="picture"
              value="{{ restaurant.picture }}"
            />
          </div>
          <div class="form-group">
            <label>Cuisine</label>
            <input
              type="text"
              name="cuisine"
              value="{{ restaurant.cuisine }}"
            />
          </div>
          <div class="form-group">
            <label>Rating</label>
            <input
              type="number"
              name="rating"
              min="0"
              max="5"
              step="0.5"
              value="{{ restaurant.rating }}"
            />
          </div>
          <button type="submit">UPDATE RESTAURANT</button>
        </form>
      </div>
    </main>
  </body>
</html>
