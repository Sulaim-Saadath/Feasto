<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Feasto</title>
    {% load static %}
    <link href="{% static 'sign_up.css' %}" rel="stylesheet" />
    <link href="{% static 'navigation.css' %}" rel="stylesheet" />
  </head>
  <body>
    <!-- Quick Navigation -->
    <nav class="navbar">
      <div class="navbar-brand">
        <span class="logo-emoji">🍕</span>
        <a href="{% url 'say_hello' %}">Feasto</a>
      </div>
      <ul class="navbar-menu">
        <li><a href="{% url 'say_hello' %}">Home</a></li>
        <li><a href="{% url 'open_signin' %}">Sign In</a></li>
      </ul>
    </nav>

    <div class="signup-container">
      <h3>🍽️ Create Your Account</h3>
      <form action="{% url 'signup' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            name="username"
            placeholder="👤 Enter your username"
            required
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            name="password"
            placeholder="🔒 Enter your password"
            required
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="📧 Enter your email" required />
        </div>

        <div class="form-group">
          <label>Mobile</label>
          <input
            type="text"
            name="mobile"
            placeholder="📱 Enter your mobile number"
            required
          />
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea
            name="address"
            placeholder="🏠 Enter your address"
            required
          ></textarea>
        </div>
        <button type="submit">SIGN UP</button>
      </form>
      <p class="signin-text">
        Already have an account?
        <a href="{% url 'open_signin' %}">Sign In</a>
      </p>
      
      <p class="signin-text" style="font-size: 12px; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px;">
        <a href="{% url 'say_hello' %}" style="color: #999;">Back to Home</a>
      </p>
    </div>
  </body>
</html>
