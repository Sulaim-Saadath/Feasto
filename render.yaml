services:
  - type: web
    name: feasto
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
  

    startCommand: gunicorn Feasto.wsgi:application

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "feasto.onrender.com,localhost,127.0.0.1"

      - key: DATABASE_URL
        fromDatabase:
          name: feasto_db
          property: connectionString

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://feasto.onrender.com"

databases:
  - name: feasto_db
    plan: free
    region: oregon
    databaseName: feasto_db
    user: feasto_user